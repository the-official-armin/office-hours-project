version: '3.8'

# Local PostgreSQL. Values come from backend/.env (copy .env.example); never commit .env.
services:
  db:
    image: postgres:15-alpine
    container_name: office_hour_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-office_hours_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
