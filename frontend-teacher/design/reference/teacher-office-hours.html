<title>Teacher Office Hours</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout concept: app shell (dark rail on desktop, bottom tabs on phones) around white cards on a cool grey ground.
   Colors and type come from the Teacher and Student designs; the dark theme values are new. */
:root{
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --bg:#F4F6F8; --surface:#FFFFFF; --soft:#F4F6F8; --line:#E1E6EA; --edge:#C9D2D9; --field:#FFFFFF;
  --ink:#16202A; --ink2:#34414C; --muted:#55616C;
  --brand:#0F6B6B; --on-brand:#FFFFFF; --link:#0F6B6B; --tint:#E3F1F0; --tint-ink:#0B4F4F;
  --side:#12303A; --side-ink:#D5E3E6; --side-mute:#A9C2C8; --accent:#3FB6A8;
  --amber:#FBEBD3; --amber-ink:#7A4A0B; --past:#EEF1F4; --past-ink:#5F6C77;
  --danger:#9B2C2C; --danger-fill:#9B2C2C; --badge:#F2B766; --badge-ink:#3B2606;
  --seat-edge:#7A8995; --toggle-off:#7A8995; --shadow:0 12px 32px rgba(18,48,58,.18);
  --blue:#E4ECF8; --blue-ink:#1F4A8A; --violet:#EEE7F7; --violet-ink:#4B2B7A;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1418; --surface:#151F25; --soft:#1B2830; --line:#26343C; --edge:#3B4C56; --field:#101A20;
    --ink:#E8EEF1; --ink2:#C3CFD6; --muted:#95A6B0;
    --brand:#2FA79B; --on-brand:#04201E; --link:#5CCDBF; --tint:#17383A; --tint-ink:#8FE0D5;
    --side:#102A32; --amber:#3A2A12; --amber-ink:#F2C98A; --past:#1B262D; --past-ink:#8D9DA7;
    --danger:#F28B8B; --danger-fill:#B23A3A; --seat-edge:#6F8390; --toggle-off:#5E717D; --blue:#1A2A44; --blue-ink:#A9C6F2; --violet:#2A2140; --violet-ink:#CDB8F0;
    --shadow:0 12px 32px rgba(0,0,0,.55); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1418; --surface:#151F25; --soft:#1B2830; --line:#26343C; --edge:#3B4C56; --field:#101A20;
  --ink:#E8EEF1; --ink2:#C3CFD6; --muted:#95A6B0;
  --brand:#2FA79B; --on-brand:#04201E; --link:#5CCDBF; --tint:#17383A; --tint-ink:#8FE0D5;
  --side:#102A32; --amber:#3A2A12; --amber-ink:#F2C98A; --past:#1B262D; --past-ink:#8D9DA7;
  --danger:#F28B8B; --danger-fill:#B23A3A; --seat-edge:#6F8390; --toggle-off:#5E717D; --blue:#1A2A44; --blue-ink:#A9C6F2; --violet:#2A2140; --violet-ink:#CDB8F0;
  --shadow:0 12px 32px rgba(0,0,0,.55); color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:var(--font);font-size:14px;line-height:1.45;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.side :focus-visible{outline-color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.num{font-variant-numeric:tabular-nums}

/* shell */
.shell{display:flex;min-height:100vh;align-items:stretch}
.side{width:248px;flex:none;background:var(--side);color:#fff;overflow:hidden;transition:width .22s ease}
.side-in{width:248px}
.shell.collapsed .side{width:0}
.sidetog{margin-left:-14px}
.shell.collapsed .topin .logo{display:flex}
.side-in{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;display:flex;flex-direction:column;gap:4px;padding:24px 16px 16px max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:12px;padding:4px 12px 24px}
.logo{width:36px;height:36px;flex:none;border-radius:10px;background:var(--accent);color:#12303A;display:flex;align-items:center;justify-content:center}
.brand b{display:block;font-size:16px;font-weight:800;line-height:1.2}
.brand span{display:block;font-size:12px;color:var(--side-mute)}
.ni{display:flex;align-items:center;gap:12px;width:100%;padding:0 12px;min-height:44px;border-radius:10px;border:0;background:transparent;color:var(--side-ink);font-size:14px;font-weight:600;text-align:left}
.ni:hover{background:rgba(255,255,255,.08)}
.ni[aria-current="page"]{background:rgba(255,255,255,.14);color:#fff}
.badge{margin-left:auto;background:var(--badge);color:var(--badge-ink);border-radius:999px;font-size:12px;font-weight:800;padding:2px 8px;font-variant-numeric:tabular-nums}
.grow{flex:1}
.me{display:flex;align-items:center;gap:12px;padding:16px 12px 8px;border-top:1px solid rgba(255,255,255,.14);margin-top:12px}
.avatar{width:36px;height:36px;flex:none;border-radius:50%;background:var(--accent);color:#12303A;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.me b{display:block;font-size:14px;font-weight:700}
.me span{display:block;font-size:12px;color:var(--side-mute)}

.col{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px 32px}
.topin .logo{display:none}
.hint{font-size:13px;color:var(--muted);min-width:0}
.seg{display:inline-flex;border:1px solid var(--edge);border-radius:12px;padding:3px;gap:2px;background:var(--soft)}
.seg button{min-height:38px;padding:0 16px;border:0;border-radius:9px;background:transparent;font-size:14px;font-weight:700;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.seglab{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.iconbtn{position:relative;width:44px;height:44px;flex:none;border-radius:10px;border:1px solid var(--edge);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;padding:0}
.iconbtn .dotbadge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--badge);color:var(--badge-ink);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.pop{position:fixed;z-index:50;top:calc(env(safe-area-inset-top,0px) + 66px);right:max(16px,env(safe-area-inset-right,0px));width:min(380px,calc(100vw - 32px));max-height:min(520px,70vh);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.pop h2{font-size:15px;font-weight:800;padding:14px 16px 8px}
.note{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line);font-size:14px;line-height:1.45}
.note.unread{background:var(--tint)}
.note i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:transparent}
.note.unread i{background:var(--brand)}
.note small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.popfoot{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end}

.page{padding:32px max(40px,env(safe-area-inset-right,0px)) 48px 40px;display:flex;flex-direction:column;gap:24px;min-width:0}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.pagehead h1{font-size:28px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.pagehead p{margin-top:6px;color:var(--muted);font-size:15px}
.backlink{display:inline-flex;align-items:center;gap:4px;min-height:28px;font-size:14px;font-weight:700;color:var(--link);background:none;border:0;padding:0}
.tabbar{display:none}

/* controls */
.btn{min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--edge);background:var(--surface);color:var(--ink);font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.danger{color:var(--danger)}
.btn.dangerfill{background:var(--danger-fill);border-color:var(--danger-fill);color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;padding:0;color:var(--link);font-weight:700;font-size:14px;text-decoration:none}
.pill{min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--edge);background:var(--surface);color:var(--ink);font-size:14px;font-weight:700}
.pill[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--ink2);min-width:0}
.lab{display:block;font-size:13px;font-weight:700;color:var(--ink2)}
.input{width:100%;height:44px;border:1px solid var(--edge);border-radius:10px;padding:0 12px;background:var(--field);color:var(--ink);font-size:15px}
textarea.input{height:auto;padding:10px 12px;line-height:1.5;resize:vertical}
.fieldrow{display:flex;gap:16px;flex-wrap:wrap}
.fieldrow>.field{flex:1 1 200px}
.sw{position:relative;flex:none;width:52px;height:32px;border-radius:999px;border:0;padding:0;background:var(--toggle-off)}
.sw[aria-checked="true"]{background:var(--brand)}
.sw i{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .12s}
.sw[aria-checked="true"] i{left:24px}
.stepper{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.stepper output{min-width:64px;text-align:center;font-size:32px;font-weight:800}
.stepper .iconbtn{font-size:22px;font-weight:700}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;min-width:0}
.card.tight{padding:20px}
.calcard{padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.stack24{display:flex;flex-direction:column;gap:24px;min-width:0}
.split{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.split>*{min-width:0}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:12px}
.h2{font-size:18px;font-weight:800}
.eyebrow{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.muted{color:var(--muted)}
.small{font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.stat .k{font-size:13px;font-weight:600;color:var(--muted)}
.stat .v{margin-top:8px;font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.stat .v small{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0}
.stat .s{margin-top:4px;font-size:13px;color:var(--muted)}
.banner{display:flex;align-items:center;gap:12px;background:var(--tint);color:var(--tint-ink);border-radius:12px;padding:14px 18px;font-size:14px;font-weight:600}
.banner svg{flex:none}
.banner.warn{background:var(--amber);color:var(--amber-ink);align-items:flex-start;line-height:1.5}
.banner.warn svg{margin-top:1px}
.inset{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.6;color:var(--ink2)}
.inset b{color:var(--ink)}
.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:8px;padding:4px 10px;background:var(--tint);color:var(--tint-ink);white-space:nowrap}
.chip.amber{background:var(--amber);color:var(--amber-ink)}
.chip.past{background:var(--past);color:var(--ink2)}
.row{display:flex;align-items:center;gap:16px;padding:16px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row>.grow{flex:1 1 180px;min-width:0}
.row .t{font-size:15px;font-weight:700}
.row .w{font-size:13px;color:var(--muted);margin-top:2px}
.row .r{font-size:13px;color:var(--ink2);margin-top:4px}
.row .end{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.dblock{width:56px;height:56px;flex:none;border-radius:12px;background:var(--tint);color:var(--tint-ink);display:flex;flex-direction:column;align-items:center;justify-content:center}
.dblock span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.dblock b{font-size:20px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.dblock.amber{background:var(--amber);color:var(--amber-ink)}
.dblock.past{background:var(--past);color:var(--past-ink)}
.dots{display:inline-flex;gap:4px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--seat-edge);background:var(--surface)}
.dot.on{background:var(--brand);border-color:var(--brand)}
.seatline{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.msg{background:var(--tint);color:var(--tint-ink);border-radius:12px;padding:12px 16px;font-size:14px;font-weight:600}
.err{font-size:14px;font-weight:600;color:var(--danger)}
.empty{border-top:1px solid var(--line);padding:24px 0 8px;font-size:14px;color:var(--muted)}
.confirmbar{flex:1 1 100%;background:var(--amber);border-radius:12px;padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;color:var(--amber-ink);font-size:14px;font-weight:600}
.confirmbar .acts{display:flex;gap:8px;flex-wrap:wrap}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.dow{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:0 4px}
.cell{min-height:112px;border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:stretch;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);min-width:0}
.cell.past{background:var(--past)}
.cell.dim .dn{color:var(--muted)}
.cell.today{border-color:var(--brand)}
.cell.sel{box-shadow:0 0 0 2px var(--brand)}
.cell:disabled{cursor:default;color:inherit}
.cell .top{display:flex;align-items:center;justify-content:space-between;gap:4px;flex-wrap:wrap}
.dn{font-size:14px;font-weight:700}
.cell.past .dn{color:var(--past-ink)}
.todaypill{font-size:11px;font-weight:800;background:var(--brand);color:var(--on-brand);border-radius:999px;padding:2px 8px}
.cc{align-self:stretch;max-width:100%;font-size:12px;font-weight:700;line-height:1.25;border-radius:8px;padding:4px 8px;background:var(--tint);color:var(--tint-ink);overflow-wrap:anywhere}
.cc.amber{background:var(--amber);color:var(--amber-ink)}
.cc.past{background:var(--past);color:var(--past-ink);border:1px solid var(--line)}
.cc.mine{background:var(--brand);color:var(--on-brand)}
.cc.fit{align-self:flex-start}
.cc .sh{display:none}
.narrowonly{display:none}
.legend{display:flex;flex-wrap:wrap;gap:16px;padding-top:16px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.monthnav{display:flex;align-items:center;gap:8px}
.monthnav output{min-width:150px;text-align:center;font-size:18px;font-weight:800}

/* seats */
.stagecap{text-align:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stage{height:6px;border-radius:999px;background:var(--edge);margin:0 8px}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:10px}
.seat{width:100%;height:60px;border-radius:14px 14px 8px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--surface);color:var(--ink);border:1.5px solid var(--edge);padding:0}
.seat b{font-size:17px;font-weight:800;line-height:1}
.seat span{font-size:11px;font-weight:700;line-height:1}
.seat.taken{background:var(--past);color:var(--past-ink);border-color:var(--line)}
.seat.mine{background:var(--tint);color:var(--tint-ink);border-color:var(--brand)}
.seat.picked{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.seat:disabled{cursor:default}
.seat.open:disabled{opacity:.55}
.keys{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.keys span{display:inline-flex;align-items:center;gap:6px}
.keys i{width:12px;height:12px;border-radius:4px;display:inline-block;border:1.5px solid var(--edge);background:var(--surface)}
.keys i.t{background:var(--past);border-color:var(--line)}
.keys i.y{background:var(--tint);border-color:var(--brand)}
.keys i.p{background:var(--brand);border-color:var(--brand)}

/* teachers */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.tcard{display:flex;flex-direction:column;gap:14px;padding:20px}
.tcard .who{display:flex;align-items:center;gap:12px}
.tcard .av{width:44px;height:44px;flex:none;border-radius:50%;background:var(--tint);color:var(--tint-ink);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center}
.tcard .nx{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px;margin-top:auto}
.filters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px}
.filters .field{flex:1 1 260px;max-width:420px}
.chips{display:flex;gap:8px;flex-wrap:wrap}

/* table */
.thead,.trow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.2fr) minmax(0,2.4fr) minmax(0,1.6fr);gap:16px;align-items:center}
.thead{padding:8px 12px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.trow{padding:16px 12px;border-top:1px solid var(--line)}
.trow .pp{display:flex;align-items:center;gap:12px;min-width:0;font-weight:700}
.trow .av{width:36px;height:36px;flex:none;border-radius:50%;background:var(--tint);color:var(--tint-ink);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.trow .rs{display:flex;gap:8px;flex-wrap:wrap}
.trow p{line-height:1.5;color:var(--ink2)}

/* gate */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.gatecard{width:min(520px,100%);display:flex;flex-direction:column;gap:20px}
.gatecard .logo{width:48px;height:48px;border-radius:14px}
.rolebtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:14px;border:1px solid var(--edge);background:var(--surface);min-height:72px}
.rolebtn:hover{border-color:var(--brand)}
.rolebtn .av{width:44px;height:44px;flex:none;border-radius:50%;background:var(--tint);color:var(--tint-ink);font-weight:800;display:flex;align-items:center;justify-content:center}
.rolebtn b{display:block;font-size:16px;font-weight:800}
.rolebtn small{display:block;font-size:13px;color:var(--muted);margin-top:2px}

/* email preview */
.mail{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mail .subj{background:var(--soft);padding:12px 16px;font-size:13px;color:var(--muted)}
.mail .subj b{color:var(--ink)}
.mail .body{padding:16px;font-size:14px;line-height:1.6;color:var(--ink2);display:flex;flex-direction:column;gap:10px}
.mail .body strong{color:var(--ink)}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);z-index:60;max-width:min(520px,calc(100vw - 32px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:var(--shadow);pointer-events:none;opacity:0;transition:opacity .15s}
#toast.on{opacity:1}

.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
html.lock{overflow:hidden}

/* nav tree: groups with indented children on a guide line */
.ni .nl{flex:1;min-width:0}
.ni .badge{margin-left:0}
.ni .chev{display:inline-flex;color:var(--side-mute);transition:transform .15s}
.ni.grp[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.ni.grp.within{color:#fff;background:rgba(255,255,255,.08)}

<script>
(function () {
'use strict';
/* ===== helpers ===== */
const MODE = 'teacher'; // 'student' | 'teacher' | 'both'
const $app = document.getElementById('app');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const DOW_L = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const DOW_S = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MON_L = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const MON_S = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const dkey = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const pkey = (k) => { const p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const nowD = () => new Date();
const todayKey = () => dkey(nowD());
const fmtT = (hhmm) => { const p = hhmm.split(':').map(Number); return (p[0] % 12 || 12) + ':' + pad(p[1]) + ' ' + (p[0] >= 12 ? 'PM' : 'AM'); };
const timeShort = (hhmm) => fmtT(hhmm).replace(/ [AP]M$/, '');
const fmtRange = (a, b) => {
  const A = fmtT(a), B = fmtT(b);
  return (A.slice(-2) === B.slice(-2) ? A.replace(/ [AP]M$/, '') : A) + ' – ' + B;
};
const longDate = (k) => { const d = pkey(k); return DOW_L[d.getDay()] + ', ' + MON_L[d.getMonth()] + ' ' + d.getDate(); };
const shortDate = (k) => { const d = pkey(k); return DOW_S[d.getDay()] + ', ' + MON_S[d.getMonth()] + ' ' + d.getDate(); };
const monDay = (k) => { const d = pkey(k); return MON_S[d.getMonth()] + ' ' + d.getDate(); };
const slotStart = (k, hhmm) => { const d = pkey(k); const p = hhmm.split(':').map(Number); d.setHours(p[0], p[1], 0, 0); return d; };
const started = (k, hhmm) => slotStart(k, hhmm) <= nowD();
const pl = (n, w, ws) => n + ' ' + (n === 1 ? w : (ws || w + 's'));
const initials = (n) => n.split(' ').map((p) => p[0]).join('').slice(0, 2).toUpperCase();
const teacherInitial = (n) => n.replace(/^(Ms|Mr|Dr)\.\s+/, '').split(' ').map((p) => p[0]).join('').slice(0, 2).toUpperCase();
const ago = (ms) => {
  const m = Math.round((Date.now() - ms) / 60000);
  if (m < 1) return 'Just now';
  if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60);
  if (h < 24) return h + (h === 1 ? ' hour ago' : ' hours ago');
  const d = Math.round(h / 24);
  return d === 1 ? 'Yesterday' : d + ' days ago';
};
let uid = 100;
const nid = (p) => p + (++uid);
const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const getPath = (o, p) => p.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
const setPath = (o, p, v) => { const ks = p.split('.'); const last = ks.pop(); const t = ks.reduce((a, k) => a[k], o); t[last] = v; };

/* ===== example data (built from today's date so it always looks current) ===== */
let S;
function seed() {
  const T0 = startOfDay(nowD());
  const fwd = (dows, n) => { const out = []; let d = addDays(T0, 1); while (out.length < n) { if (dows.indexOf(d.getDay()) >= 0) out.push(dkey(d)); d = addDays(d, 1); } return out; };
  const back = (dows, n) => { const out = []; let d = addDays(T0, -1); while (out.length < n) { if (dows.indexOf(d.getDay()) >= 0) out.push(dkey(d)); d = addDays(d, -1); } return out; };
  const tm = (id, name, start, end, days) => ({ id, name, start, end, days });
  const mk = (id, name, subject, group, timings) => ({ id, name, subject, group, max: 4, timings, off: {} });
  const teachers = [
    mk('rivera', 'Ms. Rivera', 'Mathematics', 'Math', [tm('lunch', 'Lunch', '12:10', '12:40', [2, 4]), tm('after', 'After school', '15:30', '16:00', [2, 4])]),
    mk('okafor', 'Mr. Okafor', 'Chemistry', 'Science', [tm('lunch', 'Lunch', '12:10', '12:40', [2, 5])]),
    mk('brooks', 'Ms. Brooks', 'Biology', 'Science', [tm('lunch', 'Lunch', '12:10', '12:40', [2, 4])]),
    mk('lindqvist', 'Dr. Lindqvist', 'English', 'English', [tm('after', 'After school', '15:30', '16:00', [2, 5])]),
    mk('alvarez', 'Ms. Alvarez', 'Spanish', 'Languages', [tm('lunch', 'Lunch', '12:10', '12:40', [3, 4])]),
    mk('tanaka', 'Mr. Tanaka', 'World History', 'History', [tm('after', 'After school', '15:30', '16:00', [1, 3])])
  ];
  const bookings = [];
  const add = (tid, date, slot, seat, who, sid, reason, status) => bookings.push({ id: nid('b'), tid, date, slot, seat, who, sid, reason, status: status || 'confirmed' });
  const ME = 'Maya K.';

  /* Ms. Rivera (the teacher view) */
  const riv = fwd([2, 4], 12);
  add('rivera', riv[0], 'lunch', 1, ME, 'maya', 'Review homework problems 12–18.');
  add('rivera', riv[0], 'lunch', 2, 'Daniel O.', 'daniel', 'Questions on the graphing project rubric.');
  add('rivera', riv[0], 'lunch', 3, 'Priya S.', 'priya', 'Not sure how to start the word problems.');
  add('rivera', riv[0], 'after', 2, 'Ethan W.', 'ethan', 'Wants feedback on his test corrections.');
  add('rivera', riv[1], 'lunch', 1, 'Hana B.', 'hana', 'Prep for the unit 3 exam.');
  add('rivera', riv[1], 'lunch', 2, 'Leo M.', 'leo', 'Catch up after missing two classes.');
  add('rivera', riv[2], 'lunch', 1, 'Noor A.', 'noor', 'Check my work on factoring.');
  add('rivera', riv[2], 'lunch', 2, 'Jonas R.', 'jonas', 'Study group review for the quiz.');
  add('rivera', riv[2], 'lunch', 3, 'Zoe T.', 'zoe', 'Retake plan for the last test.');
  add('rivera', riv[2], 'lunch', 4, 'Ines F.', 'ines', 'Confused about slope-intercept form.');
  add('rivera', riv[3], 'lunch', 1, 'Tariq A.', 'tariq', 'Help with the extra credit problem.');
  teachers[0].off[riv[3]] = 'Parent conference day';
  teachers[0].off[riv[5]] = 'Field trip';
  teachers[0].off[riv[9]] = 'Holiday break';
  const mon = addDays(T0, -((T0.getDay() + 6) % 7));
  for (let i = 0; i < 5; i++) {
    const d = addDays(mon, i);
    if (d <= T0 && (d.getDay() === 2 || d.getDay() === 4)) {
      const k = dkey(d);
      add('rivera', k, 'lunch', 1, 'Mia C.', 'mia', 'Help with the homework set.');
      add('rivera', k, 'lunch', 2, 'Omar H.', 'omar', 'Quiz retake planning.');
      add('rivera', k, 'lunch', 3, 'Lena V.', 'lena', 'Check my graphs.');
      add('rivera', k, 'after', 1, 'Sam D.', 'sam', 'Review the unit test.');
    }
  }

  /* other teachers */
  const ok = fwd([2, 5], 6);
  add('okafor', ok[0], 'lunch', 1, 'Daniel O.', 'daniel', 'Lab report questions.');
  add('okafor', ok[0], 'lunch', 2, 'Hana B.', 'hana', 'Review moles and molar mass.');

  add('okafor', ok[2], 'lunch', 2, 'Noor A.', 'noor', 'Study for the unit test.');
  const br = fwd([2, 4], 6);
  ['Jonas R.', 'Zoe T.', 'Ines F.', 'Tariq A.'].forEach((n, i) => add('brooks', br[0], 'lunch', i + 1, n, n.toLowerCase(), 'Cell structure review.'));
  add('brooks', br[1], 'lunch', 1, 'Mia C.', 'mia', 'Help with the genetics worksheet.');

  add('lindqvist', li[1], 'after', 1, 'Omar H.', 'omar', 'Feedback on my essay draft.');
  const al = fwd([3, 4], 6);
  add('alvarez', al[0], 'lunch', 1, 'Lena V.', 'lena', 'Practice speaking.');
  add('alvarez', al[2], 'lunch', 2, ME, 'maya', 'Practice for the oral exam.');
  teachers[4].off[al[2]] = 'Curriculum day';
  const ta = fwd([1, 3], 6);

  /* Maya's history */
  add('rivera', back([2], 1)[0], 'lunch', 2, ME, 'maya', 'Help with the chapter 3 quiz.');

  const rq = (tid, sid, who, date, time, reason, status, note) => reqs.push({ id: nid('r'), tid, sid, who, date, time, reason, status, note: note || '' });

/* ===== rules and lookups ===== */
const T = (id) => S.teachers.find((t) => t.id === id);
const RIV = () => T('rivera');
const timingOf = (b) => { const t = T(b.tid); return t ? t.timings.find((x) => x.id === b.slot) : null; };
const byStart = (a, b) => a.start.localeCompare(b.start);

function slotRows(t, key) {
  const dow = pkey(key).getDay();
  return t.timings.filter((x) => x.days.indexOf(dow) >= 0).sort(byStart).map((x) => {
    const bs = S.bookings.filter((b) => b.tid === t.id && b.date === key && b.slot === x.id && b.status === 'confirmed').sort((a, b) => a.seat - b.seat);
    return { t: x, bs, taken: bs.length, left: t.max - bs.length, started: started(key, x.start) };
  });
}
function listSlots(t, fromKey, days) {
  const out = [];
  let d = pkey(fromKey);
  for (let i = 0; i < days; i++) {
    const k = dkey(d);
    if (t.off[k] == null) slotRows(t, k).forEach((r) => { if (!r.started) out.push({ k, r, t }); });
    d = addDays(d, 1);
  }
  return out;
}
function disruption(b) {
  const t = T(b.tid);
  if (t.off[b.date] != null) return 'out';
  const x = timingOf(b);
  if (!x || x.days.indexOf(pkey(b.date).getDay()) < 0) return 'changed';
  return null;
}
const DISRUPT_TEXT = { out: 'Teacher is out that day', changed: 'This office hour was moved' };
function conflict(date, timing, tid) {
  return S.bookings.find((b) => {
    if (b.sid !== 'maya' || b.status !== 'confirmed' || b.date !== date) return false;
    if (b.tid === tid && b.slot === timing.id) return false;
    const o = timingOf(b);
    return o && o.start < timing.end && timing.start < o.end;
  });
}
function checkBooking(tid, date, slotId, seat) {
  const t = T(tid);
  const x = t && t.timings.find((y) => y.id === slotId);
  if (!x || x.days.indexOf(pkey(date).getDay()) < 0) return 'That office hour does not exist.';
  if (t.off[date] != null) return t.name + ' is out on ' + longDate(date) + '.';
  if (started(date, x.start)) return 'That office hour has already started. Pick a later one.';
  if (!seat || seat < 1 || seat > t.max) return 'Pick a seat first.';
  if (S.bookings.some((b) => b.tid === tid && b.date === date && b.slot === slotId && b.status === 'confirmed' && b.seat === seat)) return 'Someone just took that seat. Pick another one.';
  const mine = S.bookings.find((b) => b.sid === 'maya' && b.status === 'confirmed' && b.tid === tid && b.date === date && b.slot === slotId);
  if (mine) return 'You already have Seat ' + mine.seat + ' in this office hour.';
  const c = conflict(date, x, tid);
  if (c) return 'You are already booked at that time with ' + T(c.tid).name + '.';
  return '';
}
function myUpcoming() {
  return S.bookings.filter((b) => b.sid === 'maya' && b.status === 'confirmed' && !started(b.date, timingOf(b).start))
    .sort((a, b) => (a.date + timingOf(a).start).localeCompare(b.date + timingOf(b).start));
}
function myPast() {

    .sort((a, b) => (b.date + timingOf(b).start).localeCompare(a.date + timingOf(a).start));
}
function rivUpcomingBookings() {

function notify(role, text) { S.notes[role].unshift({ id: nid('n'), text, at: Date.now(), read: false }); }
function minSeats() {

function monthWeeks(y, m) {
  const first = new Date(y, m, 1), last = new Date(y, m + 1, 0);
  let d = addDays(first, -((first.getDay() + 6) % 7));
  const weeks = [];
  while (d <= last) {
    const wk = [];
    for (let i = 0; i < 5; i++) wk.push(dkey(addDays(d, i)));
    if (wk.some((k) => pkey(k).getMonth() === m)) weeks.push(wk);

function firstOfficeDay(t) {

  for (let i = 0; i < 120; i++) { const k = dkey(d); if (t.off[k] == null && slotRows(t, k).length) return k; d = addDays(d, 1); }
  return todayKey();
}

const CAL_VIEWS = [['week', 'Week'], ['month', 'Month'], ['quarter', 'Quarter']];
const monthOf = (k) => { const d = pkey(k); return { y: d.getFullYear(), m: d.getMonth() }; };
// Monday of the school week a day belongs to; a weekend jumps to the coming week.
function mondayOf(k) {
  const d = pkey(k), w = d.getDay();
  return dkey(w === 0 ? addDays(d, 1) : w === 6 ? addDays(d, 2) : addDays(d, -(w - 1)));
}
function calRange(c) {
  if (c.view === 'week') return [c.wk, dkey(addDays(pkey(c.wk), 4))];
  const n = c.view === 'quarter' ? 3 : 1;
  return [dkey(new Date(c.month.y, c.month.m, 1)), dkey(new Date(c.month.y, c.month.m + n, 0))];
}
function calSetView(c, v, sel) {
  if (v === c.view) return;
  const r = calRange(c), seen = sel && sel >= r[0] && sel <= r[1];
  if (v === 'week') {
    const tk = todayKey();
    c.wk = mondayOf(seen ? sel : (tk >= r[0] && tk <= r[1]) ? tk : r[0]);
  } else if (c.view === 'week') {
    c.month = monthOf(seen ? sel : dkey(addDays(pkey(c.wk), 2)));
  }
  c.view = v;
}
function calNav(c, n) {
  if (c.view === 'week') c.wk = dkey(addDays(pkey(c.wk), 7 * n));
  else c.month = shiftMonth(c.month, c.view === 'quarter' ? 3 * n : n);
}
function calLabel(c) {
  if (c.view === 'week') {
    const a = pkey(c.wk), b = addDays(a, 4);
    return a.getMonth() === b.getMonth() ? MON_S[a.getMonth()] + ' ' + a.getDate() + ' – ' + b.getDate() + ', ' + b.getFullYear()
      : MON_S[a.getMonth()] + ' ' + a.getDate() + ' – ' + MON_S[b.getMonth()] + ' ' + b.getDate() + ', ' + b.getFullYear();
  }
  if (c.view === 'month') return MON_L[c.month.m] + ' ' + c.month.y;
  const e = shiftMonth(c.month, 2);
  return e.y === c.month.y ? MON_S[c.month.m] + ' – ' + MON_S[e.m] + ' ' + e.y : MON_S[c.month.m] + ' ' + c.month.y + ' – ' + MON_S[e.m] + ' ' + e.y;
}

// cell(k, mo, first, view) draws a day for week and month; mini(k) draws a day for quarter.
function calGrid(c, cell, mini) {
  if (c.view === 'week') {
    let s = '';
    for (let i = 0; i < 5; i++) { const k = dkey(addDays(pkey(c.wk), i)); s += cell(k, monthOf(k), false, 'week'); }
    return '<div class="cal wkv">' + s + '</div>';

  if (c.view === 'quarter') {
    let s = '';
    for (let i = 0; i < 3; i++) {
      const mo = shiftMonth(c.month, i);
      let cells = '';
      monthWeeks(mo.y, mo.m).forEach((wk) => wk.forEach((k) => { cells += pkey(k).getMonth() === mo.m ? mini(k) : '<span class="mc blank" aria-hidden="true"></span>'; }));

    }
    return '<div class="qgrid">' + s + '</div>';
  }
  let cells = '', first = true;
  monthWeeks(c.month.y, c.month.m).forEach((wk) => wk.forEach((k) => { cells += cell(k, c.month, first, 'month'); first = false; }));
  return '<div class="cal" style="padding-bottom:8px">' + DOW_S.slice(1, 6).map((n) => '<div class="dow">' + n + '</div>').join('') + '</div><div class="cal">' + cells + '</div>';

function newBk(tid, day) {
  const d = pkey(day || firstBookableDay(tid));
  return { tid, day: dkey(d), view: 'month', wk: mondayOf(dkey(d)), month: { y: d.getFullYear(), m: d.getMonth() }, pick: null, reason: '', err: '', done: null, reqOpen: false, reqSent: false, reqErr: '', req: { date: '', time: '15:45', reason: '' } };
}
function stuDay(t, k) {
  const tk = todayKey(), past = k < tk, off = t.off[k] != null;
  const rows = slotRows(t, k);

  let left = 0, bookable = false, mine = false;
  rows.forEach((r) => { if (r.bs.some((b) => b.sid === 'maya')) mine = true; if (!r.started) { bookable = true; left += Math.max(0, r.left); } });
  const full = selectable && bookable && left === 0;
  const d = pkey(k);
  const aria = DOW_L[d.getDay()] + ', ' + MON_L[d.getMonth()] + ' ' + d.getDate() + (past ? ', past' : off ? ', teacher is out' : selectable ? (full ? ', full' : bookable ? ', ' + pl(left, 'seat') + ' left' : ', already started') : ', no office hours') + (mine ? ', you have a seat' : '');
  return { past, off, rows, selectable, left, bookable, mine, full, aria };
}
function stuMini(t, k, sel) {
  const s = stuDay(t, k);
  const st = s.off ? 'off' : s.past ? 'past' : !s.rows.length ? 'none' : !s.bookable ? 'past' : s.full ? 'full' : 'open';
  return miniCell(k, st, { sel: k === sel && s.selectable, dis: !s.selectable, act: 'bkday', aria: s.aria, mine: s.mine });
}
function stuCell(t, k, mo, sel, first, view) {
  const tk = todayKey(), s = stuDay(t, k), past = s.past, off = s.off, rows = s.rows, selectable = s.selectable, bookable = s.bookable, mine = s.mine, full = s.full, left = s.left;
  const d = pkey(k);
  const label = view === 'week' ? DOW_S[d.getDay()] + ' ' + d.getDate() : (first || d.getDate() === 1) ? MON_S[d.getMonth()] + ' ' + d.getDate() : String(d.getDate());
  let chips = '';
  if (off) chips += '<span class="cc amber fit">Day off</span>';

    if (off) chips = '<span class="cc amber fit">Teacher is out</span>';

    else rows.forEach((r) => {
      const my = r.bs.find((b) => b.sid === 'maya');

      chips += '<span class="wks' + (my ? ' mine' : (past || r.started) ? ' past' : r.left <= 0 ? ' amber' : '') + '"><b>' + esc(r.t.name) + '</b><span>' + fmtRange(r.t.start, r.t.end) + '</span><span class="st">' + esc(st) + '</span></span>';

    '<span class="top"><span class="dn num">' + label + '</span>' + (k === tk ? '<span class="todaypill">Today</span>' : '') + '</span>' + chips + '</button>';

function slotBlock(t, bk, r) {

function tMini(t, k, sel) {
  const past = k < todayKey(), off = t.off[k] != null, rows = slotRows(t, k);
  const st = off ? 'off' : past ? 'past' : !rows.length ? 'none' : rows.every((r) => r.taken >= t.max) ? 'full' : 'open';
  return miniCell(k, st, { sel: k === sel, act: 'calday', aria: tAria(t, k, rows, off), mine: !past && !off && rows.some((r) => r.taken > 0) });
}
function tCell(t, k, mo, sel, first, view) {
  const tk = todayKey(), past = k < tk, off = t.off[k] != null, d = pkey(k);
  const rows = slotRows(t, k);
  const label = view === 'week' ? DOW_S[d.getDay()] + ' ' + d.getDate() : (first || d.getDate() === 1) ? MON_S[d.getMonth()] + ' ' + d.getDate() : String(d.getDate());

    if (off) chips = '<span class="cc amber fit">Day off · ' + esc(t.off[k]) + '</span>';
    else if (!rows.length) chips = '<span class="small muted">No office hours</span>';
    else rows.forEach((r) => {
      const full = r.taken >= t.max;
      chips += '<span class="wks' + (past || r.started ? ' past' : full ? ' amber' : '') + '"><b>' + esc(r.t.name) + '</b><span>' + fmtRange(r.t.start, r.t.end) + '</span>' +
        '<span class="st">' + dotsHtml(r.taken, t.max) + ' ' + r.taken + '/' + t.max + '</span>' +
        (r.bs.length ? '<span class="who">' + r.bs.map((b) => esc(b.who)).join(', ') + '</span>' : '') + '</span>';
    });
  } else {
    chips = off ? '<span class="cc amber fit">Day off</span>' : '';

      const sh = r.t.name.charAt(0).toUpperCase() + ' ' + (full ? 'Full' : r.taken + '/' + t.max);

    });

function validateHours(h) {
  const L = h.list;
  if (!L.length) return 'Add at least one timing so students can book you.';
  const seen = {};
  for (let i = 0; i < L.length; i++) {
    const n = L[i], nm = n.name.trim();
    if (!nm) return 'Give each timing a name. Click “Name this timing” to type one.';
    if (seen[nm.toLowerCase()]) return 'Two timings are called “' + nm + '”. Give each its own name.';
    seen[nm.toLowerCase()] = 1;
    if (!n.start || !n.end) return 'Set a start and an end time for ' + nm + '.';
    if (n.start >= n.end) return nm + ': the end time must be after the start time.';
    if (!n.days.length) return nm + ' has no days. Pick at least one day, or remove it.';
  }
  for (let i = 0; i < L.length; i++) for (let j = i + 1; j < L.length; j++) {
    const a = L[i], b = L[j];
    const d = a.days.find((x) => b.days.indexOf(x) >= 0);
    if (d && a.start < b.end && b.start < a.end) return a.name.trim() + ' and ' + b.name.trim() + ' overlap on ' + DOW_L[d] + '. Change a time or a day.';
  }
  return '';
}
function orphanCount(h) {
  const t = RIV();

  rivUpcomingBookings().forEach((b) => {
    const x = h.list.find((y) => y.id === b.slot);
    if ((!x || x.days.indexOf(pkey(b.date).getDay()) < 0) && t.off[b.date] == null) n++;
  });
  return n;
}
function applyHours() {
  const h = S.ui.hours, t = RIV();
  t.timings.filter((x) => !x.gone).forEach((x) => {
    const n = h.list.find((y) => y.id === x.id);
    const changed = n && (x.start !== n.start || x.end !== n.end || x.name !== n.name.trim());
    S.bookings.filter((b) => b.tid === 'rivera' && b.slot === x.id && b.status === 'confirmed' && b.sid === 'maya' && !started(b.date, x.start)).forEach((b) => {
      if (!n) notify('student', t.name + ' stopped holding ' + x.name + '. Your booking on ' + shortDate(b.date) + ' needs a new time.');
      else if (n.days.indexOf(pkey(b.date).getDay()) < 0) notify('student', t.name + ' no longer holds ' + n.name.trim() + ' on ' + shortDate(b.date) + '. Cancel your booking and pick another time.');
      else if (changed) notify('student', t.name + ' moved ' + n.name.trim() + ' to ' + fmtRange(n.start, n.end) + '. Your booking on ' + shortDate(b.date) + ' still stands.');
    });

}

    if (S.ui.sideOpen) sd.removeAttribute('inert'); else sd.setAttribute('inert', '');
    const lab = (S.ui.sideOpen ? 'Hide' : 'Show') + ' navigation';
    b.setAttribute('aria-expanded', String(S.ui.sideOpen)); b.setAttribute('aria-label', lab); b.title = lab + ' (Ctrl+B)';
  },
  navgroup(a) { S.ui.navOpen[a] = S.ui.navOpen[a] === false; render(); },
  modal(a) { closeNotes(); S.ui.modal = a; S.ui.modalFrom = 'mo-' + a; pendingFocus = 'mclose'; render(); },
  closemodal() { S.ui.modal = null; pendingFocus = S.ui.modalFrom; render(); },
  calview(a) {
    const p = a.split('|'), c = p[0] === 'bk' ? S.ui.bk : S.ui.cal;
    calSetView(c, p[1], p[0] === 'bk' ? c.day : c.sel); render();
  },
  calnav(a) { const p = a.split('|'); calNav(p[0] === 'bk' ? S.ui.bk : S.ui.cal, Number(p[1])); render(); },
  calopen(a) { const c = S.ui.cal; c.sel = a; c.view = 'week'; c.wk = mondayOf(a); A.go('calendar'); },
  hadd() {
    const h = S.ui.hours;
    if (h.list.length >= MAX_TIMINGS) return;
    const id = nid('tm');
    h.list.push({ id, name: '', start: '07:45', end: '08:15', days: [] });
    S.ui.hoursConfirm = 0; S.ui.hoursErr = '';
    pendingFocus = 'hn-' + id; render();
  },
  hrm(a) {
    const h = S.ui.hours, i = h.list.findIndex((x) => x.id === a);
    if (i < 0) return;
    const gone = h.list.splice(i, 1)[0];
    S.ui.hoursConfirm = 0; S.ui.hoursErr = '';
    pendingFocus = h.list[i] ? 'hn-' + h.list[i].id : h.list[i - 1] ? 'hn-' + h.list[i - 1].id : 'hadd';
    render(); toast((gone.name.trim() || 'Timing') + ' removed. Discard changes to undo.');
  },
  login(a) { S.ui.gate = false; S.ui.role = a; render(); toTop(); },
  logout() { closeNotes(); S.ui.gate = true; render(); toTop(); },
  reset() { const r = S.ui.role; S = seed(); S.ui.role = r; render(); toTop(); toast('Example data reset.'); },
  bell() { if (S.ui.notesOpen) closeNotes(); else S.ui.notesOpen = true; render(); },
  readall() { S.notes[S.ui.role].forEach((n) => { n.read = true; }); render(); },
  tfilter(a) { S.ui.tf = a; render(); },
  openbook(a) { S.ui.bk = newBk(a); S.ui.pg.student = 'book'; render(); toTop(); },
  bookslot(a) { const p = a.split('|'); S.ui.bk = newBk(p[0], p[1]); S.ui.pg.student = 'book'; render(); toTop(); },
  bkmonth(a) { S.ui.bk.month = shiftMonth(S.ui.bk.month, Number(a)); render(); },
  bkday(a) { const bk = S.ui.bk; bk.day = a; bk.pick = null; bk.err = ''; bk.done = null; bk.reqSent = false; render(); scrollAside(); },
  bkseat(a) {
    const p = a.split('|'), bk = S.ui.bk;
    bk.pick = (bk.pick && bk.pick.slot === p[0] && bk.pick.seat === Number(p[1])) ? null : { slot: p[0], seat: Number(p[1]) };
    bk.err = ''; render();
  },
  bkconfirm() {
    const bk = S.ui.bk, t = T(bk.tid);
    if (!bk.pick) bk.err = 'Pick a seat first.';
    else if (bk.reason.trim().length < 10) bk.err = 'Tell your teacher a little more about what you need (at least 10 characters).';
    else {
      const e = checkBooking(bk.tid, bk.day, bk.pick.slot, bk.pick.seat);
      if (e) bk.err = e;
      else {
        const x = t.timings.find((y) => y.id === bk.pick.slot);
        S.bookings.push({ id: nid('b'), tid: bk.tid, date: bk.day, slot: x.id, seat: bk.pick.seat, who: S.prefs.student.name, sid: 'maya', reason: bk.reason.trim(), status: 'confirmed' });
        if (bk.tid === 'rivera') notify('teacher', S.prefs.student.name + ' booked Seat ' + bk.pick.seat + ' in ' + x.name + ' on ' + shortDate(bk.day) + '.');
        bk.done = { date: bk.day, slotName: x.name, time: fmtRange(x.start, x.end), seat: bk.pick.seat };
        bk.pick = null; bk.reason = ''; bk.err = '';
        toast('Seat booked.');
      }
    }
    render();
    if (bk.done) scrollAside();
  },
  bkagain() { S.ui.bk.done = null; render(); },
  bktogglereq() { const bk = S.ui.bk; bk.reqOpen = !bk.reqOpen; bk.reqSent = false; bk.reqErr = ''; render(); },
  bksendreq() {
    const bk = S.ui.bk, t = T(bk.tid), r = bk.req;
    const nowHM = pad(nowD().getHours()) + ':' + pad(nowD().getMinutes());
    if (!r.date) bk.reqErr = 'Choose a date.';
    else if (!r.time) bk.reqErr = 'Choose a time.';
    else if (r.date < todayKey() || (r.date === todayKey() && r.time <= nowHM)) bk.reqErr = 'Choose a time that hasn’t passed.';
    else if (t.off[r.date] != null) bk.reqErr = t.name + ' is out on ' + longDate(r.date) + '. Choose another day.';
    else if (r.reason.trim().length < 10) bk.reqErr = 'Tell ' + t.name + ' why you need this time (at least 10 characters).';
    else {
      S.reqs.push({ id: nid('r'), tid: bk.tid, sid: 'maya', who: S.prefs.student.name, date: r.date, time: r.time, reason: r.reason.trim(), status: 'pending', note: '' });
      if (bk.tid === 'rivera') notify('teacher', S.prefs.student.name + ' sent a request for ' + shortDate(r.date) + ' at ' + fmtT(r.time) + '.');
      bk.reqErr = ''; bk.reqOpen = false; bk.reqSent = true; bk.req = { date: '', time: '15:45', reason: '' };
      toast('Request sent.');
    }
    render();
  },
  bktab(a) { S.ui.bkTab = a; S.ui.cancelId = ''; render(); },
  askcancel(a) { S.ui.cancelId = a; S.ui.bkMsg = ''; pendingFocus = 'yes-' + a; render(); },
  keepbk() { const id = S.ui.cancelId; S.ui.cancelId = ''; pendingFocus = 'c-' + id; render(); },
  cancelbk(a) {
    const b = S.bookings.find((x) => x.id === a), t = T(b.tid), x = timingOf(b);
    b.status = 'cancelled';
    if (b.tid === 'rivera') notify('teacher', b.who + ' cancelled Seat ' + b.seat + ' in ' + x.name + ' on ' + shortDate(b.date) + '. The seat is open again.');
    S.ui.cancelId = ''; S.ui.bkMsg = 'Booking cancelled. ' + t.name + ' was told and the seat is open again.';
    render();
  },
  cancelreq(a) {
    const r = S.reqs.find((x) => x.id === a);
    S.reqs = S.reqs.filter((x) => x.id !== a);
    if (r.tid === 'rivera') notify('teacher', r.who + ' cancelled the request for ' + shortDate(r.date) + '.');
    toast('Request cancelled.'); render();
  },
  tog(a) { const p = S.prefs[S.ui.role]; p[a] = !p[a]; render(); },
  lead(a) { S.prefs[S.ui.role].lead = a; render(); },
  savesettings() {
    const role = S.ui.role, p = S.prefs[role], d = S.ui.sd[role];
    if (d.name !== undefined && !d.name.trim()) { toast('Enter a name first.'); return; }
    Object.keys(d).forEach((k) => { p[k] = typeof d[k] === 'string' ? d[k].trim() : d[k]; });
    S.ui.sd[role] = {};
    toast('Settings saved.'); render();
  },
  fakepw() { toast('Changing a password isn’t part of this preview.'); },

  reqact(a) {
    const p = a.split('|'), r = S.reqs.find((x) => x.id === p[0]);
    r.status = p[1];
    r.note = RIV().name + (p[1] === 'accepted' ? ' accepted this time.' : ' declined this time.');
    if (r.sid === 'maya') notify('student', RIV().name + (p[1] === 'accepted' ? ' accepted' : ' declined') + ' your request for ' + shortDate(r.date) + '.');
    toast(p[1] === 'accepted' ? 'Request accepted.' : 'Request declined.'); render();
  },
  reqtab(a) { S.ui.reqTab = a; render(); },
  calmonth(a) { S.ui.cal.month = shiftMonth(S.ui.cal.month, Number(a)); render(); },
  calday(a) { S.ui.cal.sel = a; render(); },
  markoff(a) { const o = S.ui.off; o.date = a; o.err = ''; o.confirm = 0; closeNotes(); S.ui.pg.teacher = 'daysoff'; render(); toTop(); },
  hday(a) {
    const p = a.split('|'), h = S.ui.hours.list.find((x) => x.id === p[0]), d = Number(p[1]);
    const i = h.days.indexOf(d);
    if (i >= 0) h.days.splice(i, 1); else h.days.push(d);
    S.ui.hoursConfirm = 0; render();
  },
  seats(a) {
    const h = S.ui.hours, ms = minSeats();
    if (Number(a) < 0 && h.max <= ms && ms > 1) S.ui.seatsNote = true;
    else { S.ui.seatsNote = false; h.max = Math.max(1, Math.min(30, h.max + Number(a))); }
    render();
  },
  savehours() {
    const h = S.ui.hours, e = validateHours(h);
    S.ui.hoursConfirm = 0;
    if (e) { S.ui.hoursErr = e; render(); return; }
    const n = orphanCount(h);
    if (n > 0) { S.ui.hoursErr = ''; S.ui.hoursConfirm = n; pendingFocus = 'confirmhours'; render(); return; }
    applyHours(); render();
  },
  confirmhours() { applyHours(); render(); },
  backhours() { S.ui.hoursConfirm = 0; render(); },
  discardhours() { S.ui.hours = null; S.ui.hoursErr = ''; S.ui.hoursConfirm = 0; S.ui.pg.teacher = 'dashboard'; toast('Changes discarded.'); render(); toTop(); },
  addoff() {
    const o = S.ui.off, t = RIV();
    o.confirm = 0;
    if (!o.date) o.err = 'Choose a date.';
    else if (o.date < todayKey()) o.err = 'That date has passed. Choose today or a later day.';
    else if (t.off[o.date] != null) o.err = longDate(o.date) + ' is already a day off.';
    else {
      const n = affectedOn(o.date).length;
      if (n > 0) { o.err = ''; o.confirm = n; pendingFocus = 'confirmoff'; }
      else { applyOff(); }
    }
    render();
  },
  confirmoff() { applyOff(); render(); },
  canceloff() { S.ui.off.confirm = 0; render(); },
  rmoff(a) {
    const t = RIV();
    delete t.off[a];
    affectedOn(a).filter((b) => b.sid === 'maya').forEach(() => notify('student', t.name + ' is back on ' + longDate(a) + '. Your booking is on again.'));
    toast('Day off removed.'); render();
  }
};

/* ===== events ===== */
const HOOKS = {
  count(el) { const c = document.getElementById('reasonCount'); if (c) c.textContent = el.value.length + ' / 300'; },
  tsearch() { const g = document.getElementById('tgrid'); if (g) g.innerHTML = teacherGrid(); },
  hprev(el) {
    const m = el.closest('.tsize') && el.closest('.tsize').querySelector('.tmirror'); if (m) m.textContent = el.value || el.placeholder;
    const p = document.getElementById('hprev'); if (p) p.innerHTML = hoursPreview();
  }
};
$app.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.act];
  if (fn) fn(el.dataset.arg, el, e);
});
function onField(e) {
  const el = e.target, f = el.dataset && el.dataset.field;
  if (!f) return;
  setPath(S, f, el.value);
  if (el.dataset.hook && HOOKS[el.dataset.hook]) HOOKS[el.dataset.hook](el);
}
$app.addEventListener('input', onField);
$app.addEventListener('change', onField);
document.addEventListener('click', (e) => {
  if (S && S.ui.notesOpen && !e.target.closest('.pop') && !e.target.closest('[data-act="bell"]')) { closeNotes(); render(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && S.ui.modal) { A.closemodal(); return; }
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 'b' && !S.ui.gate && !S.ui.modal && window.innerWidth >= 900) { e.preventDefault(); A.sidetog(); return; }
  if (e.key === 'Escape' && S.ui.notesOpen) { closeNotes(); pendingFocus = 'bell'; render(); }
  if (e.key === 'Enter' && e.target.closest && e.target.closest('.tname')) { e.preventDefault(); e.target.blur(); }
  if (e.key === 'Tab' && S.ui.modal) {
    const f = Array.from(document.querySelectorAll('.modal button:not([disabled]), .modal input'));
    if (!f.length) return;
    const i = f.indexOf(document.activeElement);
    if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
  }
});

S = seed();
if (MODE !== 'both') S.ui.role = MODE;
render();
})();
</script>
